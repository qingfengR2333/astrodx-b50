name: build-dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 先自检：文件没传全会在这里 5 秒内报错，不用等 Theos 装完
      - name: 自检（检查工程文件是否齐全）
        run: |
          echo "仓库根目录内容："
          ls -la
          missing=0
          for f in Makefile Tweak.x B50Core.m B50Core.h control; do
            if [ -f "$f" ]; then
              echo "  ✓ $f"
            else
              echo "::error::缺少 $f —— 工程文件没有全部上传到仓库根目录"
              missing=1
            fi
          done
          if [ ! -f .github/workflows/build.yml ]; then
            echo "::warning::workflow 文件路径异常"
          fi
          exit $missing

      - name: 安装 Theos
        run: |
          brew install ldid xz || true
          ok=0
          for i in 1 2 3; do
            rm -rf "$HOME/theos"
            # 先试浅克隆（快），失败再退回完整克隆（慢但更稳）
            if git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"; then
              ok=1; break
            fi
            echo "浅克隆失败（第 ${i}/3 次），改用完整克隆…"
            rm -rf "$HOME/theos"
            if git clone --recursive https://github.com/theos/theos.git "$HOME/theos"; then
              ok=1; break
            fi
            echo "第 ${i}/3 次克隆仍失败，5 秒后重试…"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Theos 克隆失败（网络问题），请重跑一次"
            exit 1
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: 编译
        run: |
          make clean || true
          make V=1

      - name: 收集产物
        run: |
          mkdir -p out
          # 关键：.theos 里还有 .dSYM/Contents/Resources/DWARF/AstroDXB50.dylib
          # 那是调试符号（MH_DSYM），不是 dylib 本体，必须排除，否则会覆盖真文件
          find .theos -type f -name "*.dylib" ! -path "*.dSYM*" -exec cp {} out/ \;
          echo "收集到的文件："; ls -l out || true
          if [ -z "$(ls -A out)" ]; then
            echo "::error::没有生成 dylib，请回看上面 make 的输出"
            exit 1
          fi
          # 强行只留 arm64 单架构：TrollFools 的 ldid 处理不了 fat 包
          for f in out/*.dylib; do
            lipo -thin arm64 "$f" -output "$f.thin" 2>/dev/null && mv "$f.thin" "$f" || true
          done
          for f in out/*.dylib; do
            if ! otool -hv "$f" | grep -q DYLIB; then
              echo "::error::$f 不是 MH_DYLIB 本体（可能又抓到 dSYM 了）"
              otool -hv "$f"
              exit 1
            fi
            echo "产物：$f"
            file "$f"
            lipo -info "$f" || true
            otool -hv "$f" | head -5 || true
            ls -l "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: AstroDXB50
          path: out/*.dylib
          if-no-files-found: error
