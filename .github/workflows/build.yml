name: build-dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          brew install ldid xz || true
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "Theos 就绪：$HOME/theos"

      - name: 编译
        run: |
          make clean || true
          make V=1

      - name: 收集产物
        run: |
          mkdir -p out
          find .theos -name "*.dylib" -exec cp {} out/ \;
          if [ -z "$(ls -A out)" ]; then
            echo "::error::没有生成 dylib，请回看上面 make 的输出"
            exit 1
          fi
          for f in out/*.dylib; do echo "产物：$f"; file "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: AstroDXB50
          path: out/*.dylib
          if-no-files-found: error
